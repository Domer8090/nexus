<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Can you look at this? A Nexus help request</title><style>
:root{color-scheme:light dark;--bg:#fff;--ink:#111;--dim:#5c5c5c;--line:#d8d8d8;--soft:#f5f5f5;--add:#0a6b2d;--del:#a3241b}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--ink:#f3f3f3;--dim:#a8a8a8;--line:#333;--soft:#161616;--add:#7ad39a;--del:#f3938b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:32px 18px 80px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}h2{font-size:19px;margin:34px 0 8px}p{margin:6px 0}.dim{color:var(--dim);font-size:14px}.ask{border-left:3px solid var(--ink);padding:4px 14px;font-size:18px;margin:18px 0;white-space:pre-wrap}
details{border:1px solid var(--line);margin:8px 0}summary{padding:12px;cursor:pointer;min-height:44px;overflow-wrap:anywhere}.in{padding:0 12px 12px}
pre{overflow:auto;max-height:420px;background:var(--soft);padding:10px;font:12.5px/1.5 ui-monospace,monospace;margin:0 0 10px}.a{color:var(--add)}.d{color:var(--del)}
label{display:block;font-weight:600;margin-top:12px}input,textarea,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--dim);padding:10px;width:100%;min-height:44px;border-radius:3px}textarea{min-height:84px;resize:vertical}
button{width:auto;background:var(--ink);color:var(--bg);border-color:var(--ink);padding:10px 18px;cursor:pointer;margin:14px 8px 0 0}button.two{background:none;color:var(--ink)}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style></head><body><main id="m"></main><script>
"use strict";const D={"id":"help_69ce9f0b882b","project":"NEXUS","task":"The usage-limit warning fires when an agent has used 80% of a window. Change that threshold to 85% everywhere it is defined or documented, and update any test that checks it.","ask":"Does this change make sense to you?","explanation":{"summary":"The usage limit warning threshold has been changed from 80% to 85% for all occurrences.","how":["The threshold was updated in the `src/runtime/limits.ts` file.","The test `tests/review.test.ts` was updated to reflect the new threshold.","The threshold is now applied consistently throughout the codebase."],"terms":[{"term":"NonNullable","meaning":"A type that cannot be null or undefined."},{"term":"UsageMetrics","meaning":"An object containing usage metrics, such as utilization and status."},{"term":"LimitLevel","meaning":"An enumeration of limit levels, such as 'ok', 'near', and 'out'."}],"quiz":[{"q":"What is the new threshold for the usage limit warning?","a":"85%"},{"q":"Where is the threshold updated?","a":"In the `src/runtime/limits.ts` file."},{"q":"What happens to the warning when the threshold is reached?","a":"The warning is displayed, and the step may be skipped or wait for another agent to take it."}],"engine":"llama3.2:3b on this computer","reader":"beginner"},"proof":{"items":[{"kind":"claim","level":"warn","text":"The agent says tests pass. Nexus couldn't confirm it from the commands it recorded"}]},"files":[{"path":"README.md","status":"modified","additions":1,"deletions":1,"patch":"diff --git a/README.md b/README.md\nindex dfd1a3d..de9ba28 100644\n--- a/README.md\n+++ b/README.md\n@@ -84,7 +84,7 @@ Nexus refuses a Codex sign-in that uses an API key, and removes `ANTHROPIC_API_K\n - **Project notes** (Notes in the Advanced toolbar): rules and decisions you write once (\"use Tailwind\", \"don't touch checkout\") go to every new step in that project, as the first part of the agent's context. Stored in Nexus's database (`kv` table), not in the project, so they reach worktrees and never end up in a commit. Up to 8,000 characters, redacted like everything else. Revisions don't get them again, since they continue a session that already has them.\n - **Orchestration**: a concurrency limit (default 2), step dependencies (the reviewer receives the builder's diff; the builder receives the planner's output), overlapping-file warnings, stop, retry. A failed or stopped session never cancels unrelated ones; dependent steps are skipped and say why.\n - **Usage**: tokens, context window and subscription windows (5-hour and 7-day utilization) only when the agent reports them. No dollar costs for subscription sessions.\n-- **Limit warnings** (`src/runtime/limits.ts`, `/api/limits`): Claude Code's windows come from its `rate_limit_event` in the newest Nexus run. Codex doesn't print its limits in `exec --json`, but it writes them to its own session log, so Nexus reads the newest `rate_limits` block from `~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl` (used percent, window, reset time; nothing else in the file is read). At 80% of any window the Advanced toolbar and the step's pane warn, and a waiting step offers **Move to** another signed-in agent. When an agent has reported a full window, a new step goes to another agent before it starts, and Ask the agents skips that agent; if no other agent can take it, the step waits and starts by itself when the full window resets (at the reset time the agent reported), with **Run now** to start it anyway. If the agent gave no reset time, the step runs and the agent's own limit message decides. Windows whose reset time has passed are ignored, so the warning clears at the reset. Nothing is estimated.\n+- **Limit warnings** (`src/runtime/limits.ts`, `/api/limits`): Claude Code's windows come from its `rate_limit_event` in the newest Nexus run. Codex doesn't print its limits in `exec --json`, but it writes them to its own session log, so Nexus reads the newest `rate_limits` block from `~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl` (used percent, window, reset time; nothing else in the file is read). At 85% of any window the Advanced toolbar and the step's pane warn, and a waiting step offers **Move to** another signed-in agent. When an agent has reported a full window, a new step goes to another agent before it starts, and Ask the agents skips that agent; if no other agent can take it, the step waits and starts by itself when the full window resets (at the reset time the agent reported), with **Run now** to start it anyway. If the agent gave no reset time, the step runs and the agent's own limit message decides. Windows whose reset time has passed are ignored, so the warning clears at the reset. Nothing is estimated.\n \n ### Studio flow and team builds\n "},{"path":"src/runtime/limits.ts","status":"modified","additions":1,"deletions":1,"patch":"diff --git a/src/runtime/limits.ts b/src/runtime/limits.ts\nindex 0dd3bbc..ae74c02 100644\n--- a/src/runtime/limits.ts\n+++ b/src/runtime/limits.ts\n@@ -20,7 +20,7 @@ export type AgentLimits = {\n   source: string;\n };\n \n-export const NEAR = 0.8;\n+export const NEAR = 0.85;\n \n export function levelOf(windows: NonNullable\u003cUsageMetrics[\"quota\"]\u003e): LimitLevel {\n   if (windows.some((w) =\u003e w.utilization \u003e= 1 || w.status === \"rejected\")) return \"out\";"},{"path":"tests/review.test.ts","status":"modified","additions":3,"deletions":2,"patch":"diff --git a/tests/review.test.ts b/tests/review.test.ts\nindex dc2029e..8ca2bc6 100644\n--- a/tests/review.test.ts\n+++ b/tests/review.test.ts\n@@ -55,9 +55,10 @@ describe(\"Codex usage limits\", () =\u003e {\n     expect([windowName(300), windowName(10080), windowName(43200), windowName(120)]).toEqual([\"5-hour\", \"7-day\", \"30-day\", \"2-hour\"]);\n   });\n \n-  it(\"warns at 80% and stops at 100% or a rejected window\", () =\u003e {\n+  it(\"warns at 85% and stops at 100% or a rejected window\", () =\u003e {\n     expect(levelOf([{ window: \"5-hour\", utilization: 0.5 }])).toBe(\"ok\");\n-    expect(levelOf([{ window: \"5-hour\", utilization: 0.8 }])).toBe(\"near\");\n+    expect(levelOf([{ window: \"5-hour\", utilization: 0.84 }])).toBe(\"ok\");\n+    expect(levelOf([{ window: \"5-hour\", utilization: 0.85 }])).toBe(\"near\");\n     expect(levelOf([{ window: \"5-hour\", utilization: 1 }])).toBe(\"out\");\n     expect(levelOf([{ window: \"7-day\", utilization: 0.4, status: \"rejected\" }])).toBe(\"out\");\n   });\n"}]};
const m=document.getElementById("m");
const el=(t,o,p)=>{const e=document.createElement(t);Object.assign(e,o||{});(p||m).append(e);return e};
el("h1",{textContent:"Can you look at this change?"});
el("p",{className:"dim",textContent:"Someone made this change in "+D.project+" with a coding agent and would like a person's opinion. You don't need an account, an app or the code. Nothing you type leaves this page until you send it yourself."});
el("p",{className:"ask",textContent:D.ask});
el("h2",{textContent:"What changed"});
if(D.explanation){const x=D.explanation;el("p",{textContent:x.summary});const ol=el("ol");x.how.forEach(h=>el("li",{textContent:h},ol));
if(x.terms.length){const t=el("details");el("summary",{textContent:"Words that may be new"},t);const i=el("div",{className:"in"},t);x.terms.forEach(v=>{const p=el("p",{},i);el("strong",{textContent:v.term+": "},p);p.append(v.meaning)})}
el("p",{className:"dim",textContent:"Explained by "+x.engine+". It can be wrong; the changes below are the source."})}
else el("p",{textContent:"The request was: "+D.task});
if(D.proof.items.length){el("h2",{textContent:"Nexus noticed"});const u=el("ul");D.proof.items.slice(0,12).forEach(i=>el("li",{textContent:i.text+(i.file?" ("+i.file+(i.line?", line "+i.line:"")+")":"")},u))}
el("h2",{textContent:D.files.length+(D.files.length===1?" file":" files")+" to look at"});
const notes=[];D.files.forEach((f,n)=>{const d=el("details",{open:n===0});el("summary",{textContent:f.path+"  (+"+f.additions+" -"+f.deletions+")"},d);const i=el("div",{className:"in"},d);const pre=el("pre",{tabIndex:0},i);
let go=false;f.patch.split("\n").forEach(l=>{if(l.startsWith("@@"))go=true;if(!go&&/^(diff|index|---|\+\+\+|new file|deleted file)/.test(l))return;el("span",{className:l[0]==="+"?"a":l[0]==="-"?"d":"",textContent:l+"\n"},pre)});
const id="n"+n;el("label",{htmlFor:id,textContent:"Your note on this file (optional)"},i);const t=el("textarea",{id,maxLength:1000},i);notes.push([f.path,t])});
el("h2",{textContent:"Your reply"});
el("label",{htmlFor:"from",textContent:"First name or nickname"});const from=el("input",{id:"from",maxLength:40,autocomplete:"off"});
el("label",{htmlFor:"v",textContent:"What do you think?"});const v=el("select",{id:"v"});[["good","Looks good to me"],["changes","I'd change something"],["question","I have a question"]].forEach(o=>el("option",{value:o[0],textContent:o[1]},v));
el("label",{htmlFor:"o",textContent:"Anything else, including what they did well"});const o=el("textarea",{id:"o",maxLength:2000});
const out=()=>{if(!from.value.trim()){say("Add a name first, so they know who helped.");from.focus();return null}return JSON.stringify({format:"nexus-reply/v1",id:D.id,from:from.value.trim(),verdict:v.value,overall:o.value.trim(),notes:notes.filter(n=>n[1].value.trim()).map(n=>({file:n[0],text:n[1].value.trim()}))},null,1)};
const copy=el("button",{textContent:"Copy reply"}),dl=el("button",{className:"two",textContent:"Save reply as a file"});const st=el("p",{className:"dim"});st.setAttribute("role","status");const say=t=>{st.textContent=t};
const box=el("textarea",{hidden:true,readOnly:true});box.setAttribute("aria-label","Your reply to copy");
copy.onclick=async()=>{const t=out();if(!t)return;try{await navigator.clipboard.writeText(t);say("Copied. Paste it into a message to them.")}catch{box.hidden=false;box.value=t;box.select();say("Copy the text in the box and send it to them.")}};
dl.onclick=()=>{const t=out();if(!t)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download="nexus-reply.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say("Saved. Send nexus-reply.json to them.")};
</script></body></html>
